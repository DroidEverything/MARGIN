<script>
(function(){
  var gate=document.getElementById('bootGate');
  var stageEl=document.getElementById('bootStage');
  var fillEl=document.getElementById('bootFill');
  var pctEl=document.getElementById('bootPct');
  var detailEl=document.getElementById('bootDetail');
  var stepsEl=document.getElementById('bootSteps');
  var skipBtn=document.getElementById('bootSkip');
  var disp=2,cap=16,done=false,timer=0,skipTimer=0,hasCustomDetail=false;

  function paint(v){
    var p=Math.max(0,Math.min(100,v));
    if(fillEl) fillEl.style.width=p.toFixed(1)+'%';
    if(pctEl) pctEl.textContent=Math.round(p)+'%';
    if(detailEl&&!hasCustomDetail){
      var mb=Math.min(31.0, (p/50)*31.0);
      detailEl.textContent=mb.toFixed(1)+' / 31.0 MB';
    }
  }
  function setStep(idx){
    if(!stepsEl||typeof idx!=='number') return;
    var nodes=stepsEl.querySelectorAll('.bstep');
    for(var i=0;i<nodes.length;i++){
      nodes[i].classList.toggle('done',i<idx);
      nodes[i].classList.toggle('active',i===idx);
    }
  }
  function step(pct,msg,nextCap,stepIdx,detail){
    if(done) return;
    if(pct>disp) disp=pct;
    cap=Math.max(disp,nextCap||pct);
    if(stageEl&&msg) stageEl.textContent=msg;
    if(detail!=null&&detailEl){hasCustomDetail=true;detailEl.textContent=detail;}
    setStep(stepIdx);
    paint(disp);
  }
  function finish(msg){
    if(done) return;
    done=true;
    if(timer){clearInterval(timer);timer=0;}
    if(skipTimer){clearTimeout(skipTimer);skipTimer=0;}
    disp=100;cap=100;
    if(stageEl) stageEl.textContent=msg||'ALL TELEMETRY LOCKED · READY';
    if(detailEl&&hasCustomDetail) detailEl.textContent='NOMINAL';
    else if(detailEl) detailEl.textContent='31.0 / 31.0 MB';
    setStep(4);
    paint(100);
    if(!gate) return;
    setTimeout(function(){
      if(!gate) return;
      gate.classList.add('ready');
      setTimeout(function(){
        if(gate&&gate.parentNode) gate.parentNode.removeChild(gate);
        gate=null;
      },500);
    },180);
  }
  if(skipBtn) skipBtn.addEventListener('click',function(){finish('ENTERING PROGRESSIVELY…');});
  window.__MARGIN_BOOT={step:step,finish:finish,isDone:function(){return done;}};
  paint(disp);
  timer=setInterval(function(){
    if(done){clearInterval(timer);timer=0;return;}
    var ceil=Math.max(disp,cap-0.8);
    if(disp<ceil){disp+=(ceil-disp)*0.055;paint(disp);}
  },120);
  skipTimer=setTimeout(function(){if(!done&&skipBtn) skipBtn.hidden=false;},12000);

  // Fullscreen toggle in top-left corner (supports desktop + mobile desktop mode)
  var fsBtn=document.getElementById('btnFullscreen');
  if(fsBtn){
    var root=document.documentElement;
    var req=root.requestFullscreen||root.webkitRequestFullscreen||root.msRequestFullscreen;
    var supported=!!(req&&(document.fullscreenEnabled!==false&&document.webkitFullscreenEnabled!==false));
    if(!supported){
      fsBtn.hidden=true;
    } else {
      function syncFs(){
        var active=!!(document.fullscreenElement||document.webkitFullscreenElement);
        fsBtn.classList.toggle('is-fs',active);
        fsBtn.setAttribute('aria-pressed',active?'true':'false');
        fsBtn.title=active?'Exit fullscreen':'Enter fullscreen';
      }
      fsBtn.addEventListener('click',function(){
        var active=!!(document.fullscreenElement||document.webkitFullscreenElement);
        if(active){
          var ex=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
          if(ex) try{ex.call(document);}catch(e){}
        } else {
          try{
            var r=req.call(root,{navigationUI:'hide'});
            if(r&&r.catch) r.catch(function(){try{req.call(root);}catch(e){}});
          }catch(e){}
        }
      });
      document.addEventListener('fullscreenchange',syncFs);
      document.addEventListener('webkitfullscreenchange',syncFs);
      syncFs();
    }
  }
})();
</script>
