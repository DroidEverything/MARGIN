<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MARGIN — NASA Mission Design Prototype</title>
<meta name="description" content="Design, launch and operate a space mission under real engineering constraints. Every number sourced from public NASA data.">
<meta name="theme-color" content="#04070d">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="styles/nasa-theme.css">
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="mark">MARG<i>I</i>N</div>
    <nav id="steps" aria-label="Mission phase"></nav>
    <div id="teambadge" class="team-badge" hidden></div>
    <button class="tb-btn" id="btnSound" aria-pressed="false" title="Toggle sound">SOUND</button>
    <button class="tb-btn" id="btnMode" title="Toggle difficulty">CADET</button>
    <button class="tb-btn" id="btnHome" title="Mission select">MISSIONS</button>
    <button class="tb-btn title-only" data-act="how" title="How it works">HOW IT WORKS</button>
    <button class="tb-btn title-only" data-act="devjump" title="Dev scene jump menu (?s= shortcuts)">DEV</button>
    <button class="tb-btn select-only" data-act="gohome" title="Back to homescreen">HOME</button>
  </header>
  <main id="screen" tabindex="-1"></main>
  <div id="dock" class="action-dock hidden"></div>
  <div id="hud" class="hidden"></div>
  <footer id="telem"><button id="btnTelemToggle" class="telem-btn" title="Toggle telemetry ticker">TICKER</button><div class="run" id="telemRun"></div></footer>
</div>
<div id="veil" aria-hidden="true"></div>
<div id="tip" role="tooltip"></div>
<div id="cascade" aria-hidden="true"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div id="teamhint" role="status" aria-live="polite" hidden></div>
<div id="teamhand" role="dialog" aria-modal="true" aria-labelledby="thtitle" hidden>
  <div class="th-card">
    <div class="th-kicker">TEAM HAND-OFF</div>
    <h3 id="thtitle"></h3>
    <p id="thbody"></p>
    <div id="thseats" class="th-seats"></div>
    <button class="btn primary" data-act="handoff" style="width:100%">CONTINUE</button>
  </div>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script src="js/constants.js"></script>
<script src="js/time-service.js"></script>
<script src="js/astronomy-jpl-data.js"></script>
<script src="js/astronomy-jpl-data-de440.js"></script>
<script src="js/astronomy-jpl-data-bennu.js"></script>
<script src="js/astronomy.js"></script>
<script src="js/surface-data.js"></script>
<script src="js/mars-surface-data.js"></script>
<script src="js/nasa-hardware-data.js?v=20261030g"></script>
<script src="game.js?v=20261030g"></script>
</body>
</html>
